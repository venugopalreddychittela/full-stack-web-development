<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>
</head>
<body>
    <!-- STUDENT REGISTRATION FORM-->
    <h1>College Information Portal</h1>
    <h2>Student Registration Form</h2>

    <p>
        Please enter your details to register as a student.
    </p>

    <form>
        <!-- Name -->
        <label for="studentName">Full Name:</label>
        <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
        <br><br>
        <!-- Email -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
        <br><br>       
        <!-- Password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <br><br>
        
        <!-- Gender -->
        <label>Gender:</label>
        
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <!-- Hobbies -->
        <label>Hobbies:</label>
        
        <input type="checkbox" id="coding" name="hobbies" value="Coding">
        <label for="coding">Coding</label>
        
        <input type="checkbox" id="sports" name="hobbies" value="Sports">
        <label for="sports">Sports</label>
        
        <input type="checkbox" id="music" name="hobbies" value="Music">
        <label for="music">Music</label>

        <input type="checkbox" id="dancing" name="hobbies" value="Dancing">
        <label for="dancing">Dancing</label>

        <input type="checkbox" id="reading" name="hobbies" value="Reading">
        <label for="reading">Reading</label>
        
        <br><br>

        <!-- Branch Dropdown -->
        <label for="branch">Select Branch:</label>

        <select id="branch" name="branch">

            <option value="">-- Select Branch --</option>
            <option value="cse">Computer Science and Engineering</option>
            <option value="aiml">Computer Science and Engineering (Artificial Intelligence and Machine Learning)</option>
            <option value="ece">Electronics and Communication Engineering</option>
            <option value="eee">Electrical and Electronics Engineering</option>
            <option value="mech">Mechanical Engineering</option>

        </select>

        <br><br>

        <!-- Comments -->
        <label for="comments">Comments:</label>
        <br>

        <textarea
            id="comments"
            name="comments"
            rows="5"
            cols="40"
            placeholder="Enter your comments here..."
        ></textarea>

        <br><br>

        <!-- Form Buttons -->
        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
